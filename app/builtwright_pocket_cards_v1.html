<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuiltWright: Pocket Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a18; color: #e8e6df; font-family: 'Rajdhani', sans-serif; min-height: 100vh; padding: 2rem 1rem; }
  .bw-wrap { max-width: 720px; margin: 0 auto; }
  .bw-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.5rem; border-bottom: 1px solid #3a3a36; padding-bottom: 0.75rem; }
  .bw-logo { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #BA7517; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
  .bw-logo a { color: #BA7517; text-decoration: none; }
  .bw-title { font-size: 24px; font-weight: 600; color: #f0ede4; }
  .bw-badge { font-family: 'Share Tech Mono', monospace; font-size: 10px; background: #2a1f08; color: #BA7517; padding: 3px 8px; border-radius: 3px; letter-spacing: 1px; border: 0.5px solid #BA7517; }
  .bw-tabs { display: flex; gap: 4px; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .bw-tab { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 1px; padding: 6px 12px; border-radius: 4px; border: 0.5px solid #3a3a36; background: #242420; color: #888780; cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
  .bw-tab:hover { background: #2e2e2a; color: #e8e6df; border-color: #BA7517; }
  .bw-tab.active { background: #BA7517; color: #fff; border-color: #BA7517; font-weight: 600; }
  .bw-panel { display: none; } .bw-panel.active { display: block; }
  .bw-section-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #5F5E5A; text-transform: uppercase; margin-bottom: 0.75rem; }
  .family-label { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 2px; color: #BA7517; text-transform: uppercase; margin: 1rem 0 0.5rem 0; }
  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 0.5rem; }
  .type-card { background: #2e2e2a; border: 1px solid #3a3a36; border-radius: 8px; padding: 0.9rem; cursor: pointer; transition: all 0.15s; }
  .type-card:hover, .type-card.selected { border-color: #BA7517; background: #2a1f08; box-shadow: 0 0 0 2px #BA7517; }
  .type-card-icon { font-size: 22px; color: #BA7517; margin-bottom: 5px; }
  .type-card-name { font-size: 13px; font-weight: 600; color: #f0ede4; margin-bottom: 2px; }
  .type-card-sub { font-size: 11px; color: #888780; }
  .comp-detail { background: #2e2e2a; border: 0.5px solid #3a3a36; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .comp-detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; }
  .comp-detail-icon { font-size: 22px; color: #BA7517; }
  .comp-detail-name { font-size: 16px; font-weight: 600; color: #f0ede4; }
  .comp-detail-role { font-size: 13px; color: #888780; margin-top: 1px; }
  .comp-detail-body { font-size: 14px; color: #c8c6bf; line-height: 1.65; margin-bottom: 0.75rem; }
  .comp-detail-tips { list-style: none; }
  .comp-detail-tips li { font-size: 13px; color: #888780; padding: 3px 0 3px 16px; position: relative; line-height: 1.5; }
  .comp-detail-tips li::before { content: '→'; position: absolute; left: 0; color: #BA7517; }
  .comp-placeholder { text-align: center; padding: 2rem; color: #5F5E5A; font-size: 13px; font-family: 'Share Tech Mono', monospace; letter-spacing: 1px; border: 0.5px dashed #3a3a36; border-radius: 8px; margin-bottom: 1.5rem; }
  .info-block { background: #2e2e2a; border: 0.5px solid #3a3a36; border-radius: 8px; padding: 1.1rem 1.25rem; margin-bottom: 10px; }
  .info-block-title { font-size: 15px; font-weight: 600; color: #f0ede4; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 8px; }
  .info-block-title i { color: #BA7517; font-size: 17px; }
  .info-block-body { font-size: 13px; color: #c8c6bf; line-height: 1.6; }
  .info-block-tips { list-style: none; margin-top: 0.6rem; }
  .info-block-tips li { font-size: 13px; color: #888780; padding: 3px 0 3px 16px; position: relative; line-height: 1.5; }
  .info-block-tips li::before { content: '→'; position: absolute; left: 0; color: #BA7517; }
  .callout-box { border-radius: 8px; padding: 1.1rem 1.25rem; margin-bottom: 1.25rem; border: 1.5px solid #EF9F27; background: #2a1f08; }
  .callout-box.red { border-color: #A32D2D; background: #200d0d; }
  .callout-box.blue { border-color: #185FA5; background: #0c1f33; }
  .callout-box-header { display: flex; align-items: center; gap: 8px; margin-bottom: 0.6rem; }
  .callout-box-icon { font-size: 20px; color: #EF9F27; }
  .callout-box.red .callout-box-icon, .callout-box.red .callout-box-title, .callout-box.red strong { color: #F09595; }
  .callout-box.blue .callout-box-icon, .callout-box.blue .callout-box-title, .callout-box.blue strong { color: #85B7EB; }
  .callout-box-title { font-family: 'Share Tech Mono', monospace; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #EF9F27; font-weight: 600; }
  .callout-box-body { font-size: 13px; color: #c8c6bf; line-height: 1.6; }
  .callout-box-body strong { color: #EF9F27; font-weight: 600; }
  .callout-tips { list-style: none; margin-top: 0.6rem; }
  .callout-tips li { font-size: 13px; color: #888780; padding: 3px 0 3px 16px; position: relative; line-height: 1.5; }
  .callout-tips li::before { content: '→'; position: absolute; left: 0; color: #EF9F27; }
  .callout-box.red .callout-tips li::before { color: #F09595; }
  .field-tip { display: flex; gap: 10px; background: #1e1e1c; border-left: 3px solid #BA7517; border-radius: 0 6px 6px 0; padding: 0.7rem 0.9rem; margin: 0.75rem 0; }
  .field-tip i { color: #BA7517; font-size: 16px; flex-shrink: 0; margin-top: 2px; }
  .field-tip div { font-size: 13px; color: #c8c6bf; line-height: 1.55; }
  .field-tip strong { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: #BA7517; display: block; margin-bottom: 2px; }
  .adv-wrap { border-radius: 8px; overflow: hidden; border: 0.5px solid #3a3a36; margin-bottom: 1.25rem; }
  .adv-toggle { width: 100%; background: #242420; border: none; padding: 0.75rem 1.1rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; gap: 10px; }
  .adv-toggle-left { display: flex; align-items: center; gap: 8px; }
  .adv-toggle-icon { font-size: 15px; color: #BA7517; }
  .adv-toggle-label { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #BA7517; font-weight: 600; text-align: left; }
  .adv-chevron { font-size: 13px; color: #BA7517; transition: transform 0.2s; }
  .adv-wrap.open .adv-chevron { transform: rotate(180deg); }
  .adv-body { display: none; background: #1e1e1c; padding: 1rem 1.1rem; border-top: 0.5px solid #3a3a36; }
  .adv-wrap.open .adv-body { display: block; }
  .adv-body p { font-size: 13px; color: #c8c6bf; line-height: 1.6; margin-bottom: 0.75rem; }
  .adv-body strong { color: #e8e6df; font-weight: 600; }
  .chain-wrap { background: #242420; border: 0.5px solid #3a3a36; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; overflow-x: auto; }
  .chain { display: flex; align-items: center; flex-wrap: nowrap; gap: 0; }
  .chain-node { flex-shrink: 0; }
  .chain-box { background: #2e2e2a; border: 1px solid #3a3a36; border-radius: 6px; padding: 7px 9px; text-align: center; cursor: pointer; transition: all 0.15s; min-width: 70px; }
  .chain-box:hover, .chain-box.selected { border-color: #BA7517; background: #2a1f08; box-shadow: 0 0 0 2px #BA7517; }
  .chain-icon { font-size: 18px; color: #BA7517; display: block; margin-bottom: 2px; }
  .chain-label { font-size: 11px; font-weight: 600; color: #e8e6df; }
  .chain-sub { font-size: 9px; color: #888780; }
  .chain-arrow { font-size: 14px; color: #5F5E5A; padding: 0 3px; flex-shrink: 0; }
  .sym-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
  .sym-card { background: #2e2e2a; border: 1px solid #3a3a36; border-radius: 8px; padding: 0.9rem; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .sym-card:hover, .sym-card.selected { border-color: #BA7517; background: #2a1f08; box-shadow: 0 0 0 2px #BA7517; }
  .sym-card-label { font-size: 12px; font-weight: 600; color: #f0ede4; text-align: center; }
  .sym-card-sub { font-size: 10px; color: #888780; text-align: center; }
  .sym-detail { background: #2e2e2a; border: 0.5px solid #3a3a36; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .sym-detail-body { font-size: 13px; color: #c8c6bf; line-height: 1.6; margin-top: 0.75rem; }
  .sym-detail-tips { list-style: none; margin-top: 0.6rem; }
  .sym-detail-tips li { font-size: 12px; color: #888780; padding: 2px 0 2px 16px; position: relative; line-height: 1.5; }
  .sym-detail-tips li::before { content: '→'; position: absolute; left: 0; color: #BA7517; font-size: 11px; }
  .ref-table { width: 100%; border-collapse: collapse; margin: 0.5rem 0 1rem 0; font-size: 12px; }
  .ref-table th { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: #BA7517; text-align: left; padding: 6px 8px; border-bottom: 1px solid #3a3a36; }
  .ref-table td { padding: 6px 8px; border-bottom: 0.5px solid #2e2e2a; color: #c8c6bf; vertical-align: top; line-height: 1.4; }
  .ref-table td:first-child { color: #f0ede4; font-weight: 600; white-space: nowrap; }
  .progress-bar { height: 3px; background: #242420; border-radius: 2px; margin-bottom: 1rem; overflow: hidden; }
  .progress-fill { height: 100%; background: #BA7517; border-radius: 2px; transition: width 0.3s; }
  .tree-q { background: #2e2e2a; border: 0.5px solid #3a3a36; border-radius: 8px; padding: 1rem 1.25rem; }
  .tree-q-text { font-size: 15px; font-weight: 600; color: #f0ede4; margin-bottom: 0.5rem; line-height: 1.4; }
  .tree-q-hint { font-size: 12px; color: #888780; margin-bottom: 0.75rem; font-style: italic; line-height: 1.45; }
  .tree-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .tree-btn { font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; padding: 7px 16px; border-radius: 5px; border: 0.5px solid #3a3a36; background: #242420; color: #e8e6df; cursor: pointer; transition: all 0.12s; text-align: left; }
  .tree-btn:hover { border-color: #BA7517; background: #2a1f08; color: #EF9F27; }
  .tree-btn.yes { border-color: #3B6D11; } .tree-btn.yes:hover { background: #0e1f05; color: #97C459; }
  .tree-btn.no { border-color: #A32D2D; } .tree-btn.no:hover { background: #200d0d; color: #F09595; }
  .tree-result { border-radius: 8px; padding: 1rem 1.25rem; margin-top: 8px; }
  .tree-result.action { background: #2a1f08; border: 0.5px solid #BA7517; }
  .tree-result.fix { background: #0e1f05; border: 0.5px solid #3B6D11; }
  .tree-result.escalate { background: #200d0d; border: 0.5px solid #A32D2D; }
  .tree-result-label { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
  .tree-result.action .tree-result-label { color: #EF9F27; }
  .tree-result.fix .tree-result-label { color: #97C459; }
  .tree-result.escalate .tree-result-label { color: #F09595; }
  .tree-result-text { font-size: 14px; font-weight: 500; color: #f0ede4; line-height: 1.55; }
  .tree-result-sub { font-size: 12px; color: #888780; margin-top: 5px; line-height: 1.5; }
  .tree-prevent { margin-top: 10px; padding-top: 8px; border-top: 0.5px solid rgba(255,255,255,0.08); font-size: 12px; color: #c8c6bf; line-height: 1.5; }
  .tree-prevent strong { font-family: 'Share Tech Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: #97C459; display: block; margin-bottom: 2px; }
  .tree-back { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 1px; color: #888780; background: none; border: none; cursor: pointer; padding: 4px 0; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; }
  .tree-back:hover { color: #BA7517; }
  .bw-footer { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #5F5E5A; letter-spacing: 1px; text-align: right; margin-top: 1rem; padding-top: 0.75rem; border-top: 0.5px solid #3a3a36; }

  .card { background:#242420; border:0.5px solid #3a3a36; border-radius:10px; padding:1rem 1.25rem; margin-bottom:1rem; }
  .card.red { border-color:#A32D2D; } .card.green { border-color:#3B6D11; } .card.amber { border-color:#BA7517; }
  .card-title { font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#BA7517; margin-bottom:0.5rem; }
  .card.red .card-title { color:#F09595; } .card.green .card-title { color:#97C459; }
  .card ol { margin:0; padding-left:1.2rem; } .card li { font-size:14px; color:#f0ede4; line-height:1.5; margin-bottom:4px; }
  .card .src { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; color:#5F5E5A; margin-top:8px; }
  .card .src a { color:#BA7517; text-decoration:none; }
  @media print { .card { page-break-inside:avoid; page-break-after:always; background:#fff; border:1px solid #000; color:#000; } .card li { color:#000; } .card-title { color:#000 !important; } .bw-tabs, .pm-btn { display:none; } body { background:#fff; } }
  .pm-btn { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:1px; text-transform:uppercase; background:#242420; color:#BA7517; border:0.5px solid #BA7517; border-radius:4px; padding:8px 12px; cursor:pointer; margin-bottom:1rem; }
</style>
</head>
<body>
<div class="bw-wrap">
  <div class="bw-header"><div><div class="bw-logo"><a href="builtwright_diagnose_hub_v1.html">BuiltWright</a></div><div class="bw-title">Pocket Cards</div></div><div class="bw-badge">Print</div></div>
  <div class="ref-note">Ten cards that end up laminated on a toolbox. Each prints on its own page. Every one is a summary of a module tab; the link on each card opens the full version.</div>
  <button class="pm-btn" onclick="window.print()"><i class="ti ti-printer"></i> Print all cards</button>
  <div id="pc-cards"></div>

  <div class="bw-footer">builtwrightapp.com &nbsp;·&nbsp; pocket cards</div>
</div>
<script src="data/pocketcards.js"></script>
<script>
  // The cards are data. This produces exactly the markup the page used to carry inline,
  // which build/validate.mjs checks by regenerating it and comparing.
  document.getElementById('pc-cards').innerHTML = BW_DATA.pocketcards.map(function (c) {
    return '<div class="card ' + c.cls + '"><div class="card-title">' + c.title + '</div><ol>' +
      c.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') +
      '</ol><div class="src">Full version: <a href="' + c.file + '#' + c.tab + '">' + c.linkText + '</a></div></div>';
  }).join('');
</script>
</body>
</html>
